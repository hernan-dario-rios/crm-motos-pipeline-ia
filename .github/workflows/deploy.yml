name: Despliegue Continuo en AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y actualizar servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          command_timeout: 45m
          script: |
            cd /home/ubuntu/crm-motos-pipeline-ia
        
            git stash
            git pull origin main
            
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            source venv/bin/activate
            pip install -r requirements.txt
            
            pkill -f uvicorn || true
            pkill -f streamlit || true
            
            # 5. Levantar servicios y desvincularlos de la sesión SSH
            nohup uvicorn api:app --host 0.0.0.0 --port 8000 > api.log 2>&1 < /dev/null &
            disown
            
            nohup streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0 > dashboard.log 2>&1 < /dev/null &
            disown
            
            # 6. Pausa para cierre limpio y desconexión
            sleep 2
            exit 0