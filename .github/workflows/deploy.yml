name: Despliegue Continuo en AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y actualizar servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # 1. Ir a la ruta absoluta del proyecto
            cd /home/ubuntu/crm-motos-pipeline-ia
            
            # 2. Traer el código nuevo
            git pull origin main
            
            # 3. Activar el entorno virtual e instalar dependencias
            source venv/bin/activate
            pip install -r requirements.txt
            
            # 4. Detener servicios anteriores (si existen)
            pkill -f uvicorn || true
            pkill -f streamlit || true
            
            # 5. Reiniciar la API (El < /dev/null evita que GitHub se quede congelado)
            nohup uvicorn api:app --host 0.0.0.0 --port 8000 < /dev/null > api.log 2>&1 &
            
            # 6. Reiniciar el Dashboard
            nohup streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0 < /dev/null > dashboard.log 2>&1 &