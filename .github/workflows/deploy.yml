name: Despliegue Continuo en AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y actualizar servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          command_timeout: 45m
          script: |
            cd /home/ubuntu/crm-motos-pipeline-ia
            git stash
            git pull origin main
            
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Reiniciar los servicios nativos (GitHub se desconectará en un segundo)
            sudo systemctl restart api dashboard